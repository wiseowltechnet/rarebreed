<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RareBreed - Login</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #fff;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 40px;
        backdrop-filter: blur(12px);
        width: 380px;
        text-align: center;
      }
      h1 {
        background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      input {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        margin-bottom: 14px;
        font-size: 15px;
      }
      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .err {
        color: #ff6b6b;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>RareBreed</h1>
      <form id="f">
        <input id="u" placeholder="Username" required />
        <input id="p" type="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <div id="e" class="err"></div>
      </form>
    </div>

    <script>
      document.getElementById("f").onsubmit = async (e) => {
        e.preventDefault();
        const r = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("u").value,
            password: document.getElementById("p").value,
          }),
        });
        if (r.ok) window.location = "/";
        else document.getElementById("e").textContent = "Invalid credentials";
      };
    </script>
  </body>
</html>
